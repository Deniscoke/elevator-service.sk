<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 170" width="460" height="170" role="img" aria-label="ELEVÁTOR SERVIS, s.r.o. Banská Bystrica">
  <!--
    Logo prekreslené do vektoru podľa fotografie pečiatky.
    Ide o REKONŠTRUKCIU tvaru, nie o presný obtiah — pred použitím
    treba porovnať s originálnym PNG/JPG od klienta a tvar odsúhlasiť.
    Žltá #FFC61A je farba menšej šípky podľa zadania klienta.
  -->
  <title>ELEVÁTOR SERVIS, s.r.o.</title>

  <g transform="translate(60 18)">
    <path d="M100 0 L 34 38 L 0 38 L 46 18 Z" fill="#FFC61A" transform="translate(0 34) scale(0.62)"/>
    <path d="M100 0 L 34 38 L 0 38 L 46 18 Z" fill="#12161B" transform="translate(64 0) scale(1.32)"/>
  </g>

  <text x="60" y="128" font-family="Arial Black, Arial Bold, Arial, sans-serif" font-weight="900"
        font-size="27" letter-spacing="1.2" fill="#12161B">ELEVÁTOR SERVIS</text>
  <text x="330" y="128" font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="16" fill="#12161B">s.r.o.</text>
  <text x="60" y="158" font-family="Arial Black, Arial Bold, Arial, sans-serif" font-weight="900"
        font-size="27" letter-spacing="1.2" fill="#12161B">BANSKÁ BYSTRICA</text>
</svg>
