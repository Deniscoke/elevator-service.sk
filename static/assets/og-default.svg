<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ELEVÁTOR SERVIS — servis výťahov, Banská Bystrica">
  <!--
    DOČASNÝ OG OBRÁZOK.
    Väčšina sociálnych sietí nevykresľuje SVG v náhľadoch odkazov.
    Pred spustením webu treba dodať 1200×630 PNG alebo JPG
    (najlepšie s firemným logom) — viď docs/MISSING_DATA.md.
  -->
  <defs>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0v72" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0b0f14"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- značka -->
  <g transform="translate(80 90)">
    <rect x="0" y="0" width="56" height="56" fill="none" stroke="#FFC61A" stroke-width="2.5"/>
    <path d="M28 13 36 22H20l8-9Z" fill="#FFC61A"/>
    <path d="M28 43 20 34h16l-8 9Z" fill="#FFC61A"/>
    <path d="M10 28h36" stroke="#FFC61A" stroke-width="2"/>
  </g>

  <text x="160" y="118" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="6">ELEVÁTOR</text>
  <text x="160" y="150" fill="#FFC61A" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="10">SERVIS</text>

  <text x="80" y="330" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-1.5">Servis výťahov</text>
  <text x="80" y="412" fill="#FFC61A" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-1.5">Banská Bystrica</text>

  <line x1="80" y1="470" x2="1120" y2="470" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>

  <text x="80" y="520" fill="#a9b7c4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26">Servis · Opravy · Odborné prehliadky · Modernizácia</text>

  <!-- výstražný pás vpravo dole ako technický detail -->
  <g transform="translate(80 560)">
    <rect x="0" y="0" width="180" height="6" fill="#FFC61A"/>
  </g>
</svg>
